name: ci

on:
  push:
    branches: ["**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The X11 backend links libX11 (`#[link(name = "X11")]`). The runner
      # image ships the runtime library but not the `libX11.so` linker
      # symlink, which lives in libx11-dev — without it every link step here
      # (test, clippy, build) dies with `cannot find -lX11`. Not needed on
      # Windows or macOS, whose backends link nothing extra.
      - name: install X11 development files
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev
      # The suite is headless (NullHost + software canvas), so the whole
      # portable core — parse, layout, gfx, app logic — is exercised on
      # all three OSes on every push. On Windows and macOS this also compiles
      # that platform's backend; every OS's backend is also type-checked in
      # the `cross-check` job below (the `editor_check_*` cfgs).
      - run: cargo test
      # Warnings fail the build. The old deferral ("wait for the ttf.rs dead
      # code and mark_dirty cleanup") is done history: the tree is clippy-
      # clean under -D warnings, and a maintenance-stage app shouldn't let a
      # new warning land unchallenged.
      - run: cargo clippy --all-targets -- -D warnings

  # The `editor_check_*` cfgs (declared in `Cargo.toml`, wired through
  # `platform/mod.rs`) type-check one foreign backend per build, which is
  # how a backend's syntax is kept healthy between visits. No job exercised
  # them before this one, and unexercised cfgs rot: a one-line edit in a
  # backend you were not looking at could break compiling everywhere else
  # with nothing noticing until a release prepared on the wrong machine.
  # `check` is enough (never linked), so no GUI header or X11 dev files are
  # needed beyond the host toolchain.
  #
  # The flags cannot all leave their home OS yet, and this job runs the two
  # that can plus a wiring pin for the third: `editor_check_linux` from the
  # Windows runner is the true foreign check (`linux.rs` has the `not(unix)`
  # seam for exactly that); `editor_check_win` still has unseamed
  # `std::os::windows::ffi` uses (update.rs's wide-string builders), and
  # `editor_check_macos` rejects any non-Apple target outright (`link(kind =
  # "framework")` is an E0455 on foreign targets, and `macos.rs`'s map_file
  # uses `std::os::unix`) — both flags here exercise their wiring on the
  # home runner, not yet from abroad.
  cross-check:
    name: cross-check (editor_check_${{ matrix.backend }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            backend: linux
          - os: windows-latest
            backend: win
          - os: macos-latest
            backend: macos
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: RUSTFLAGS="--cfg editor_check_${{ matrix.backend }}" cargo check

  # Not a unit test but a budget: the suite above checks what the app paints,
  # and this checks what it *costs*. Large-file regressions (a whole-document
  # layout per frame, a quadratic wrap, a preview that keeps the text twice)
  # are invisible to a pixel assertion and to every sample file in the repo, so
  # synthetic 2 MB documents are opened, painted and scrolled against budgets
  # in `src/perf.rs`. Release, because debug-build milliseconds mean nothing,
  # and one OS, because the budgets are calibrated to a runner.
  cost:
    name: cost (large files)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: install X11 development files
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev
      - name: synthetic documents stay inside their budgets
        run: cargo test --release -- --ignored perf --nocapture

  # The release packagers copy files by name; a rename that misses one of them
  # (a stale `readitor-mime.xml` next to an installer asking for
  # `editor-mime.xml`) breaks every user's install and nothing else notices.
  # This job owns install.sh's file handling, so it compiles nothing: a
  # stand-in executable is enough to prove what lands where, and it keeps the
  # job clear of the X11 link dependency the test job carries.
  packaging-linux:
    name: packaging (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install into a throwaway HOME and check what landed
        run: |
          rm -rf dist /tmp/unpack /tmp/fakehome
          mkdir -p dist/packaging /tmp/unpack /tmp/fakehome
          # Stand-in for the release binary; install.sh only copies it.
          : > dist/editor
          chmod +x dist/editor
          cp -r packaging/linux dist/packaging/linux
          cp -r assets/linux dist/packaging/linux/icons
          tar -czf /tmp/editor.tar.gz -C dist .
          tar -xzf /tmp/editor.tar.gz -C /tmp/unpack
          cd /tmp/unpack
          # A Desktop directory has to exist for the shortcut to be made; the
          # XDG user dirs point elsewhere when they say so, which is what the
          # second HOME below checks.
          mkdir -p /tmp/fakehome/Desktop
          HOME=/tmp/fakehome sh packaging/linux/install.sh
          test -x /tmp/fakehome/.local/bin/editor
          test -f /tmp/fakehome/.local/share/applications/editor.desktop
          test -f /tmp/fakehome/.local/share/mime/packages/editor-mime.xml
          # F23: AppStream metadata, so the app is listed by GNOME Software
          # and KDE Discover, not only the applications menu.
          test -f /tmp/fakehome/.local/share/metainfo/editor.metainfo.xml
          grep -q 'dev.editor.app' /tmp/fakehome/.local/share/metainfo/editor.metainfo.xml
          for size in 16 32 48 64 128 256 512; do
            test -f "/tmp/fakehome/.local/share/icons/hicolor/${size}x${size}/apps/editor.png"
          done
          grep -q '^Exec=/tmp/fakehome/.local/bin/editor '             /tmp/fakehome/.local/share/applications/editor.desktop
          # F16: the entry must stay valid and keep the WM_CLASS link, or the
          # shell cannot match a running window back to it (the smoke test
          # checks the runtime half of the same pair).
          sudo apt-get install -y desktop-file-utils >/dev/null
          desktop-file-validate /tmp/fakehome/.local/share/applications/editor.desktop
          grep -q '^StartupWMClass=Editor$' /tmp/fakehome/.local/share/applications/editor.desktop
          grep -q '^TryExec=editor$' /tmp/fakehome/.local/share/applications/editor.desktop
          # YAML's canonical type is `application/yaml` (IANA, RFC 9512) since
          # shared-mime-info 2.3, and `text/x-yaml` is now its alias; xdg-mime
          # defaults key on the primary type. ALL distros supported here must
          # end up with Editor for both spellings — which is why install.sh
          # sets both, and why both queries are asserted below: either query
          # returning empty (the current fallback heuristic, not our entry)
          # is a regression, not a runner quirk.
          test "$(HOME=/tmp/fakehome xdg-mime query default application/yaml)" = editor.desktop
          test "$(HOME=/tmp/fakehome xdg-mime query default text/x-yaml)" = editor.desktop
          # The Desktop shortcut: same entry, executable (GNOME will not run
          # one that is not), pointing at the installed binary.
          test -x /tmp/fakehome/Desktop/editor.desktop
          grep -q '^Exec=/tmp/fakehome/.local/bin/editor '             /tmp/fakehome/Desktop/editor.desktop
          diff /tmp/fakehome/Desktop/editor.desktop                        /tmp/fakehome/.local/share/applications/editor.desktop
          # XDG_DESKTOP_DIR holds a literal $HOME that sed cannot expand, so
          # the shortcut has to land in the directory it names, not in
          # ~/Desktop.
          rm -rf /tmp/fakehome2
          mkdir -p /tmp/fakehome2/Bureau /tmp/fakehome2/.config
          printf 'XDG_DESKTOP_DIR="$HOME/Bureau"\n' > /tmp/fakehome2/.config/user-dirs.dirs
          HOME=/tmp/fakehome2 sh packaging/linux/install.sh > /dev/null
          test -x /tmp/fakehome2/Bureau/editor.desktop
          test ! -e /tmp/fakehome2/Desktop
          # And the opt-out really opts out of one thing only.
          rm -rf /tmp/fakehome3
          mkdir -p /tmp/fakehome3/Desktop
          HOME=/tmp/fakehome3 EDITOR_NO_DESKTOP_SHORTCUT=1 sh packaging/linux/install.sh > /dev/null
          test ! -e /tmp/fakehome3/Desktop/editor.desktop
          test -f /tmp/fakehome3/.local/share/applications/editor.desktop

  # The bundle is built for real here (macOS links its frameworks natively, so
  # nothing extra to install), then checked: the icon and the version-filled
  # plist are what the Finder and the About box read.
  packaging-macos:
    name: packaging (macos)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sh packaging/macos/bundle.sh
      - name: check the bundle
        run: |
          test -f target/Editor.app/Contents/MacOS/editor
          test -f target/Editor.app/Contents/Resources/Editor.icns
          # Universal (F2): both slices in one executable, not shorthand for
          # "the host arch happens to be inside it".
          lipo -info target/Editor.app/Contents/MacOS/editor | grep -qE 'x86_64[[:space:]]+arm64|arm64[[:space:]]+x86_64'
          python3 - <<'PY'
          import plistlib
          path = 'target/Editor.app/Contents/Info.plist'
          with open(path, encoding='utf-8') as f:
              raw = f.read()
          assert '__VERSION__' not in raw, 'bundle.sh left a placeholder behind'
          plist = plistlib.loads(raw.encode())
          for key, want in (('CFBundleExecutable', 'editor'),
                            ('CFBundleIconFile', 'Editor'),
                            ('CFBundlePackageType', 'APPL')):
              assert plist[key] == want, f'{key} is {plist[key]!r}'
          version = plist['CFBundleVersion']
          assert version == plist['CFBundleShortVersionString'], version
          exts = plist['CFBundleDocumentTypes'][0]['CFBundleTypeExtensions']
          assert exts, 'no document types in the bundle'
          print(f'bundle OK: version {version}, {len(exts)} document extensions')
          PY

  # The .wxs is the riskiest XML in the repository — major-upgrade rows by
  # hand, custom-action sequencing, per-user scope, two dialogs of ours — and
  # it used to be compiled only in release.yml, on a tag, so a schema error or
  # a missing icon source surfaced in the one build users install. Same WiX
  # pairing and the same build flags as release.yml (keep the two in step),
  # unsigned at Version=0.0.0, never published, never signed. The assertions
  # live in tools/check-msi.ps1: a .wxs-text check (which the Rust tests
  # already do) cannot see what WiX actually linked — a component defined but
  # not referenced, a property it silently dropped, a dialog the sequence
  # does not show — so the job queries the built package's own database.
  packaging-windows:
    name: packaging (windows msi)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: install WiX
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 7.0.0
          # WiX v7 EULA acceptance and the UI extension: both are what
          # release.yml does before its build, and the v7 EULA is exactly the
          # kind of gate this job is here to catch years from now.
          & "$env:USERPROFILE\\.dotnet\\tools\\wix.exe" eula accept wix7
          & "$env:USERPROFILE\\.dotnet\\tools\\wix.exe" extension add -g WixToolset.UI.wixext
      - run: cargo build --release
      - name: build the unsigned msi
        shell: pwsh
        run: |
          & "$env:USERPROFILE\\.dotnet\\tools\\wix.exe" build `
            -acceptEula wix7 `
            -ext WixToolset.UI.wixext `
            -arch x64 `
            -d Version=0.0.0 `
            -d PublishDir=target/release `
            -d Icon=assets/icon.ico `
            -d DialogIcon=assets/icon-setup.ico `
            -o editor-msi-ci.msi `
            packaging/windows/editor.wxs
      - name: assert the tables in the built package
        shell: pwsh
        run: .\\tools\\check-msi.ps1 -Path editor-msi-ci.msi

  # Compiling a backend is not the same as running it: the X11 and AppKit
  # backends used to be covered only by `cargo test`, which never reaches
  # window creation — a backend that links cleanly and dies on the first
  # XMapWindow / orderFront passed every check here. These two jobs start the
  # release binary for real and look for the window.
  smoke-linux:
    name: smoke (linux window)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Xvfb provides the DISPLAY; xdotool asks that X server what is mapped;
      # xclip is the second client for the editor's clipboard round trip (F6).
      - name: install X11, Xvfb, xdotool and xclip
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev xvfb xdotool xclip x11-utils
      - run: cargo build --release
      # The probe reports *how* a failure happened, not just that it did (see
      # tools/linux-window-smoke.sh): this is the only place a Linux window is
      # ever created, so a bare "no window" would leave the next reader
      # guessing between a backend that never got there and one that crashed.
      - name: the window really opens
        run: sh tools/linux-window-smoke.sh

  smoke-macos:
    name: smoke (macos window)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - name: the app starts and puts a window on screen
        run: |
          ./target/release/editor --no-update samples/sample_markdown.md > /tmp/editor.log 2>&1 &
          pid=$!
          sleep 6
          if ! kill -0 "$pid" 2>/dev/null; then
            echo "FAIL: editor exited during startup"
            cat /tmp/editor.log
            exit 1
          fi
          # Surviving startup is not the same as having a window, and the
          # runner has no pyobjc to ask through, so ask the window server from
          # C: CoreGraphics is what actually knows what is on screen.
          # `kCGWindowName` would need Screen Recording permission, which the
          # runner never grants; the owner name is always reported, and that
          # is all this needs. Fewer than a dozen lines because the probe only
          # has to answer "is a window owned by this process on screen".
          cat > /tmp/winlist.c <<'C'
          #include <CoreFoundation/CoreFoundation.h>
          #include <CoreGraphics/CoreGraphics.h>
          #include <stdio.h>
          #include <string.h>

          int main(int argc, char **argv) {
              const char *want = argc > 1 ? argv[1] : "editor";
              CFArrayRef list = CGWindowListCopyWindowInfo(
                  kCGWindowListOptionOnScreenOnly, kCGNullWindowID);
              if (list == NULL) {
                  puts("FAIL: the window server returned no window list");
                  return 2;
              }
              int found = 0;
              CFIndex n = CFArrayGetCount(list);
              for (CFIndex i = 0; i < n; i++) {
                  CFDictionaryRef win = (CFDictionaryRef)CFArrayGetValueAtIndex(list, i);
                  CFStringRef owner = (CFStringRef)CFDictionaryGetValue(win, kCGWindowOwnerName);
                  if (owner == NULL) continue;
                  char buf[256];
                  if (!CFStringGetCString(owner, buf, sizeof buf, kCFStringEncodingUTF8)) continue;
                  if (strcmp(buf, want) == 0) {
                      fputs("on-screen window owned by ", stdout);
                      puts(buf);
                      found = 1;
                  } else if (i < 12) {
                      fputs("  (another window owner: ", stdout);
                      puts(buf);
                  }
              }
              CFRelease(list);
              if (!found) {
                  fputs("FAIL: no on-screen window owned by ", stdout);
                  puts(want);
                  return 1;
              }
              return 0;
          }
          C
          clang -framework CoreGraphics -framework CoreFoundation -o /tmp/winlist /tmp/winlist.c
          status=0
          if ! /tmp/winlist editor; then
            status=1
          fi
          kill "$pid" 2>/dev/null || true
          wait "$pid" 2>/dev/null || true
          exit $status

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check
