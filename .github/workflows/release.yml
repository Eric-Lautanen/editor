name: release

# Tag a version (v0.1.0) to build and publish binaries for all three OSes.
on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: editor-${{ github.ref_name }}-windows-x86_64.zip
          - os: ubuntu-latest
            artifact: editor-${{ github.ref_name }}-linux-x86_64.tar.gz
          - os: macos-latest
            artifact: editor-${{ github.ref_name }}-macos.zip
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # See ci.yml: the X11 backend links libX11, and the `libX11.so` linker
      # symlink is not in the runner image.
      - name: install X11 development files
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev xvfb xdotool
      # The tag is what the MSI is stamped with (`-d Version=`), and Cargo.toml
      # is what the binary reports at runtime. Drift between the two is
      # invisible until someone installs a package whose version disagrees
      # with the app in it — and an install that carries a number *above* the
      # release line makes every later MSI a refused downgrade. Fail before
      # anything is built, on every OS, so a mis-tagged release never ships.
      - name: the tag and the package version agree
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag $GITHUB_REF_NAME names $tag but Cargo.toml says $pkg"
            exit 1
          fi
          echo "version $pkg"

      - run: cargo test
      - run: cargo build --release


      # ---- signing -------------------------------------------------------
      # Nothing here runs unless the repository has the credentials, so a
      # fork builds and publishes exactly what it did before. Which secrets,
      # and how to make them, is packaging/SIGNING.md's subject. Signed
      # *before* the MSI is built, or the installer would embed an unsigned
      # copy of the executable.
      - name: sign the executable (windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        env:
          CERT_PFX_B64: ${{ secrets.WINDOWS_CERT_PFX_B64 }}
          CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          if (-not $env:CERT_PFX_B64) {
            Write-Host "::notice::WINDOWS_CERT_PFX_B64 is unset: publishing an unsigned Windows build."
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP 'codesign.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CERT_PFX_B64))
          $sdk = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\bin'
          $signtool = Get-ChildItem $sdk -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -match '\x64\' } |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw "signtool.exe not found in the Windows SDK" }
          & $signtool.FullName sign /f $pfx /p $env:CERT_PASSWORD /fd sha256 `
            /tr http://timestamp.digicert.com /td sha256 target/release/editor.exe
          if ($LASTEXITCODE -ne 0) { throw "signing editor.exe failed" }
          & $signtool.FullName verify /pa target/release/editor.exe
          if ($LASTEXITCODE -ne 0) { throw "editor.exe failed signature verification" }
          Remove-Item $pfx

      # The Linux binary that is about to be packaged and published proves it
      # opens a window here first — the same probe CI runs, on the artifact
      # users download rather than on some other build of the same commit.
      - name: the window really opens (linux)
        if: matrix.os == 'ubuntu-latest'
        run: sh tools/linux-window-smoke.sh

      # ---- package per OS -------------------------------------------------
      # WiX: pinned dotnet-tool (the runner image carries only legacy WiX
      # v3, which the v4+ schema in packaging/windows/editor.wxs predates).
      - name: install WiX (windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 7.0.0
          # WiX v7 EULA (the OSMF one; free below the \
          # $10k-revenue threshold) plus the UI extension for the
          # feature-tree dialog in editor.wxs.
          & "$env:USERPROFILE\.dotnet\tools\wix.exe" eula accept wix7
          & "$env:USERPROFILE\.dotnet\tools\wix.exe" extension add -g WixToolset.UI.wixext

      - name: package (windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Compress-Archive -Path target/release/editor.exe -DestinationPath ${{ matrix.artifact }}
          # Per-user MSI (Scope=perUser, no UAC): Add/Remove-Programs entry,
          # Start Menu shortcut, HKCU file associations, and major-upgrade
          # replacement of any previously installed MSI — the last one is
          # what makes `editor --update` a one-click story (it downloads this
          # artifact for the tag and runs msiexec). The msi's names here AND
          # in src/update.rs's asset scan must stay in sync with this stamp
          # of `editor-<tag>-windows-x86_64.msi`.
          $version = "${{ github.ref_name }}" -replace '^v', ''
          # The msi must be `editor-<tag>-windows-x86_64.msi` exactly —
          # src/update.rs's asset scan matches prefab suffix, and plain
          # `<artifact>.msi` would have produced an odd `...zip.msi`.
          $msi = "${{ matrix.artifact }}" -replace '\.zip$', '.msi'
          & "$env:USERPROFILE\.dotnet\tools\wix.exe" build `
            -acceptEula wix7 `
            -ext WixToolset.UI.wixext `
            -arch x64 `
            -d Version=$version `
            -d PublishDir=target/release `
            -d Icon=assets/icon.ico `
            -d DialogIcon=assets/icon-setup.ico `
            -o $msi `
            packaging/windows/editor.wxs


      # The MSI is signed too (SmartScreen judges the installer the user
      # double-clicks), after WiX has finished writing it.
      - name: sign the installer (windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        env:
          CERT_PFX_B64: ${{ secrets.WINDOWS_CERT_PFX_B64 }}
          CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          if (-not $env:CERT_PFX_B64) { exit 0 }
          $pfx = Join-Path $env:RUNNER_TEMP 'codesign.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CERT_PFX_B64))
          $sdk = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\bin'
          $signtool = Get-ChildItem $sdk -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -match '\x64\' } |
            Sort-Object FullName -Descending | Select-Object -First 1
          Get-ChildItem -Filter '*.msi' | ForEach-Object {
            & $signtool.FullName sign /f $pfx /p $env:CERT_PASSWORD /fd sha256 `
              /tr http://timestamp.digicert.com /td sha256 $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "signing $($_.Name) failed" }
            & $signtool.FullName verify /pa $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "$($_.Name) failed signature verification" }
          }
          Remove-Item $pfx

      - name: package (linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          mkdir -p dist/packaging
          cp target/release/editor dist/
          # Keep the repo-relative path: `cp -r packaging/linux dist/packaging`
          # would flatten the script to `packaging/install.sh`, giving the
          # tarball a path that matches neither the README nor a checkout.
          cp -r packaging/linux dist/packaging/linux
          # The hicolor launcher icons install.sh installs travel beside it.
          cp -r assets/linux dist/packaging/linux/icons
          tar -czf ${{ matrix.artifact }} -C dist .

      - name: package (macos)
        if: matrix.os == 'macos-latest'
        env:
          CERT_P12_B64: ${{ secrets.MACOS_CERT_P12_B64 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          sh packaging/macos/bundle.sh
          # ---- signing and notarization -----------------------------------
          # Same rule as Windows: no certificate, no signing, and the release
          # is exactly the unsigned one it has always been. Gatekeeper's
          # "unidentified developer" prompt is the price of a fork without
          # credentials; a repository that has them gets a bundle that just
          # opens.
          if [ -z "$CERT_P12_B64" ]; then
            echo "::notice::MACOS_CERT_P12_B64 is unset: publishing an unsigned bundle."
          else
            : "${SIGN_IDENTITY:?MACOS_SIGN_IDENTITY must be set alongside the certificate}"
            keychain="$RUNNER_TEMP/editor-signing.keychain-db"
            echo "$CERT_P12_B64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
            security create-keychain -p actions "$keychain"
            security set-keychain-settings -lut 21600 "$keychain"
            security unlock-keychain -p actions "$keychain"
            security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$CERT_PASSWORD" -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple:,codesign: -k actions "$keychain" > /dev/null
            security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
            # Hardened runtime is not optional: notarytool rejects a bundle
            # built without it, and the timestamp keeps the signature valid
            # past the certificate's own expiry.
            codesign --force --deep --timestamp --options runtime -s "$SIGN_IDENTITY" target/Editor.app
            codesign --verify --deep --strict --verbose=2 target/Editor.app
            if [ -n "$APPLE_ID" ] && [ -n "$APPLE_APP_PASSWORD" ]; then
              : "${APPLE_TEAM_ID:?APPLE_TEAM_ID must be set to notarize}"
              # Notarize a zip of the *signed* bundle, then staple the ticket
              # into it — before this step's own `ditto`, so the artifact users
              # download carries the ticket and opens offline.
              ditto -c -k --keepParent target/Editor.app "$RUNNER_TEMP/notarize.zip"
              xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
              xcrun stapler staple target/Editor.app
              xcrun stapler validate target/Editor.app
              # The real question, asked the way Gatekeeper asks it.
              spctl --assess --type execute --verbose=2 target/Editor.app
            else
              echo "::notice::signed but not notarized: APPLE_ID/APPLE_APP_PASSWORD unset."
            fi
            security delete-keychain "$keychain"
          fi
          # `--keepParent` is what puts `Editor.app` itself at the root of the
          # zip; without it `ditto -c -k` archives the bundle's *contents*, and
          # the download unzips to a stray `Contents/` folder that cannot be
          # dragged to /Applications. `--sequesterRsrc` keeps the bundle's
          # resource forks/extended attributes.
          ditto -c -k --sequesterRsrc --keepParent target/Editor.app ${{ matrix.artifact }}

      # Artifact name keeps the zip for history/cohabit reason; the publish
      # job merges all three OSes' artifacts into the release assets. Each
      # glob picks up that OS's file(s) (windows has two: zip + msi).
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            editor-v*.zip
            editor-v*.tar.gz
            editor-v*.msi
          if-no-files-found: error

  publish:
    name: publish github release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      # The integrity contract in src/update.rs: every install (manual or
      # auto-updater) verifies its download's SHA-256 against this file
      # before running it. A release without SHA256SUMS is one the updater
      # refuses to install.
      - name: publish SHA256SUMS
        run: |
          cd dist
          sha256sum editor-v* | sed 's/  / /' > SHA256SUMS
          cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body: |
            ## Editor ${{ github.ref_name }}

            | File | OS | Install |
            |---|---|---|
            | `*-windows-x86_64.msi` | Windows 10/11 | **Run it — that's the install.** Per-user, no admin: Add/Remove Programs entry, Start Menu shortcut, file associations, and a newer MSI replaces it automatically. |
            | `*-windows-x86_64.zip` | Windows 10/11 | Portable alternative: unzip anywhere, run `editor.exe --install` once to claim file associations (HKCU, no admin). |
            | `*-linux-x86_64.tar.gz` | Linux (X11/XWayland) | Unpack, run `packaging/linux/install.sh` (~/.local install + MIME defaults). |
            | `*-macos.zip` | macOS | Unzip, drag `Editor.app` to /Applications. |

            **Updating**: on Windows the app checks GitHub in the background
            and asks to install the new build for you (`editor --update` as a
            manual shortcut; `--no-update` opts a launch out). On Linux and
            macOS the same `--update` exists. Omit the MSI story: every new
            release still ships portable/overwrite-friendly binaries, and
            associations keep working across upgrades unless you move the
            executable. Run `editor --version` to check what you have.

            **Signed builds.** When the repository has its signing secrets set,
            the Windows `.exe`/`.msi` are Authenticode-signed and the macOS
            bundle is Developer-ID signed and notarized, so neither shows an
            unknown-publisher prompt. Without them the workflow still publishes
            — unsigned — and the OS will say so. See `packaging/SIGNING.md`.

            Note: the Linux and macOS GUI backends (M8/M9) are usable — the
            release binaries open real windows, and CI starts each one on a
            virtual display on every push to prove the backends come up (the
            `smoke-*` jobs). What is still missing is narrower: XDND
            drag-and-drop on Linux; IME and live theme changes on macOS. See
            `docs/PLAN.md`.
          generate_release_notes: true
