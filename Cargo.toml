[package]
name = "editor"
version = "0.2.9"
edition = "2021"
description = "A small native viewer/editor for Markdown, JSON, CSV, configs, logs and code. std only."
license = "MIT"

# NO dependencies. Ever.
[dependencies]

# Allocation census (`--mem-report FILE`): wires src/mem.rs's tracked
# global allocator + component attribution into the build.
[features]
mem-census = []

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[lints.rust]
# `--cfg editor_check_win` / `editor_check_linux` / `editor_check_macos`
# (RUSTFLAGS) type-check one platform backend from another OS — one per OS
# backend, declared here so `cargo clippy` stays warning-free everywhere.
# `feature = "mem-census"` gates the allocation-count allocator (src/mem.rs).
unexpected_cfgs = { level = "warn", check-cfg = [
    "cfg(editor_check_win)",
    "cfg(editor_check_linux)",
    "cfg(editor_check_macos)",
    "cfg(feature, values(\"mem-census\"))",
] }
