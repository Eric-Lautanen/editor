[package]
name = "readitor"
version = "0.1.0"
edition = "2021"
description = "A small native viewer/editor for Markdown, JSON and JSONL. std only."
license = "MIT"

# NO dependencies. Ever.
[dependencies]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[lints.rust]
# `--cfg readitor_check_win` (RUSTFLAGS) type-checks the Win32 backend from
# Linux/macOS; declare it so `cargo clippy` stays warning-free everywhere.
# `feature = "mem-census"` gates the allocation-count allocator (src/mem.rs).
unexpected_cfgs = { level = "warn", check-cfg = [
    "cfg(readitor_check_win)",
    "cfg(feature, values(\"mem-census\"))",
] }
